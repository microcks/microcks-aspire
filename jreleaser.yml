project:
  name: Microcks Aspire
  description: Microcks Aspire .NET library
  longDescription: Microcks Aspire .NET library
  copyright: The Microcks Authors

signing:
  active: ALWAYS
  armored: true

files:
  active: ALWAYS
  # One SBOM per target framework is generated by the release workflow
  globs:
    - pattern: 'glob:Microcks.Aspire-*.spdx-sbom.json'

release:
  github:
    overwrite: true
    releaseName: '{{tagName}}'
    tagName: '{{projectVersion}}'
    changelog:
      formatted: ALWAYS
      preset: conventional-commits
      contributors:
        format: '- {{contributorName}}{{#contributorUsernameAsLink}} ({{.}}){{/contributorUsernameAsLink}}'
